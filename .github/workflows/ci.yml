name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Challenge Tests
        run: |
          node challenges/01-html/challenge-01/test.js solution.html
          node challenges/02-css/challenge-01/test.js solution.css
          node challenges/03-javascript/challenge-01/test.js solution

      - name: Build documentation website
        run: pnpm --filter @frontend-odyssey/website build
